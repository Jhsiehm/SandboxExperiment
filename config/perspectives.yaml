# e2012 constituency-shaped simulation personas.
#
# These are labeled simulation roles for the political training-area swarm.
# They are NOT inferred from names, zips, school prestige, or protected-class
# proxies. Expand the catalog by adding personas; do not add silent scoring
# features that guess demographics.
#
# Slots 0–11 zip onto the 12 swarm bodies in config/swarm.yaml (index order).
# Personas with slot: null are catalog-only (expandable roster, unused until assigned).
name: e2012-constituency-12
simulation_only: true
not_inferred: true
notes: >
  Phase 1 demographic roster. Same FrozenEpochEnv media pack is the stimulus
  for every persona; surveys/ads/academic studies condition the reaction.
  Different districts should react differently to the same headline.
personas:
  - id: urban-northeast-dem-young
    slot: 0
    label: Urban Northeast Democrat, 25-34, bachelor
    region: northeast
    urbanicity: urban
    party_id: democrat
    age_band: "25-34"
    education: bachelor
    media_diet: [nyt, npr, msnbc]
    notes: Simulation role. Forecast as this constituency would given the pack.
