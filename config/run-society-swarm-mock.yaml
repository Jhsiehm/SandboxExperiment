# Mock 12-persona society swarm (no OpenRouter). Distinct run_id from the live probe.
# Headlines = stimulus; survey/ad/academic = conditioners; personas from
# config/perspectives.yaml. Score with: psbx eval baseline --run phase1-e2012-society-swarm-mock-container
run_id: phase1-e2012-society-swarm-mock-container
epoch: e2012
models: [swarm-median]
use_swarm: true
swarm_roster: config/swarm.yaml
perspectives: config/perspectives.yaml
question_set: data/questions/e2012.jsonl
max_tool_calls: 4
min_prominence: 0.0
n_questions: 1
category_balance:
  economic: 1
# Exercise the same frozen Docker retrieval boundary as the live swarm.
sandbox_mode: container
embedding_backend: hashing
allow_mock: true
evidence_use: practice
