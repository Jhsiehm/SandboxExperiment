# Cheap OpenRouter live probe. Defaults to one question so a dashboard click
# cannot burn a 50-item dual-model run. Override with --limit if needed.
#
# Intended swarm (this file does NOT expand it — dashboard live stays cheap):
#   8 × openai/gpt-4.1-mini + 4 × anthropic/claude-3.5-haiku
#   see config/swarm.yaml; run with config/run-swarm.yaml --limit 1
# This probe names the primary worker only. 12 agents × N questions at
# OPENROUTER_MIN_INTERVAL_SEC=2 is slow on purpose; a full 12×50 pass is hours.
run_id: phase2-e2012-openrouter
epoch: e2012
models: [openrouter-gpt-4.1-mini]
swarm_roster: config/swarm.yaml
question_set: data/questions/e2012.jsonl
max_tool_calls: 4
min_prominence: 0.0
n_questions: 1
category_balance:
  economic: 1
sandbox_mode: host
embedding_backend: hashing
allow_mock: false
