# Intended Prediction Sandbox swarm. Source of truth for the mix.
# Implemented in src/psbx/agents/swarm.py: sequential OpenRouter + median p.
#
# Demographic personas live in config/perspectives.yaml (slots 0–11 zip onto
# these 12 bodies). Do not infer demographics from names or zips.
#
# Two complementary eval tracks share this swarm and FrozenEpochEnv:
#   A) time-locked headlines as stimulus → predicted public response vs later history
#   B) survey/ad/academic-conditioned demographic swarm
# PolicySim is later. Do not weaken OpenRouter serialization.
#
# Default experiment: 12 agents — two of each planned low-end species,
# not the full OpenRouter catalog.
#   2 × openai/gpt-4.1-mini
#   2 × openai/gpt-4o-mini
#   2 × anthropic/claude-3-haiku
#   2 × google/gemini-2.5-flash-lite
#   2 × meta-llama/llama-3.1-8b-instruct
#   2 × qwen/qwen-2.5-7b-instruct
#
# Each worker: JSON forecast, no chain-of-thought, max_tokens 256 (already capped
# in psbx.openrouter), temperature ~0.8 for population variance.
#
# Shared retrieval: one search pack per question; agents only read.
#
# OpenRouter calls MUST stay serialized through the existing limiter
# (OPENROUTER_MIN_INTERVAL_SEC=2, OPENROUTER_MAX_PER_MINUTE=20, concurrency 1).
# Do not weaken those. 12 agents × N questions at ≥2s/req is slow on purpose —
# keep n_questions / --limit small (default 1). A full 12×50 pass is hours.
#
# local-* Llama/Qwen remain vLLM-only scale-up (not in this 12).
name: default-12
n_agents: 12
n_questions_default: 1
shared_retrieval: one search pack per question; agents only read
serialize_openrouter: true
rate_limit_note: >
  12 agents × N questions at OPENROUTER_MIN_INTERVAL_SEC=2 is slow on purpose.
  Serialize every OpenRouter call. Do not raise concurrency. Keep --limit small.
  A full 12×50 pass is hours.
bodies:
  - model_id: openrouter-gpt-4.1-mini
    count: 2
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Primary species. OpenAI mini, cheap JSON, no CoT.
  - model_id: openrouter-gpt-4o-mini
    count: 2
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Same class as gpt-4.1-mini. Second OpenAI prior.
  - model_id: openrouter-haiku
    count: 2
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Cheap non-thinking Haiku (anthropic/claude-3-haiku).
  - model_id: openrouter-gemini-flash-lite
    count: 2
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: google/gemini-2.5-flash-lite. Person-on-the-street volume.
  - model_id: openrouter-llama-3.1-8b
    count: 2
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Open-weight 8B via OpenRouter. Cheap body, not a reasoner.
  - model_id: openrouter-qwen-2.5-7b
    count: 2
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Open-weight 7B via OpenRouter. Cheap body, not a reasoner.
optional_scale_up: []
local_scale_up:
  - model_id: local-llama-3.1-8b
    count: 1
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Local-only. Skip unless VLLM_BASE_URL is serving Llama 3.1 8B Instruct.
  - model_id: local-qwen-2.5-7b
    count: 1
    temperature: 0.8
    json_forecast: true
    chain_of_thought: false
    max_tokens: 256
    notes: Local-only. Skip unless VLLM_BASE_URL is serving Qwen2.5 7B Instruct.
