wayback:
  # Live CDX/snapshot pulls identify as PredictionSandbox (see psbx.corpus.ia_http).
  # Honor 429 / Retry-After. Do not use this as the agent search UI.
  cdx_api: https://web.archive.org/cdx/search/cdx
  rate_limit_seconds: 5.0
  collapse: digest
  statuscode: 200
  paths:
    - "/"
    - "/world"
    - "/business"
    - "/politics"
    - "/economy"
    - "/us"
    - "/international"
    - "/europe"
    - "/middleeast"
    - "/markets"

prominence_weights:
  outlet_weight: 0.40
  front_page_minutes: 0.20
  syndication_count: 0.20
  gdelt_mention_count: 0.20
