# 12-agent society swarm: FrozenEpochEnv search + OpenRouter votes + median p.
# Personas: config/perspectives.yaml. Eval: psbx eval baseline --run <id>
# Exports AgentSociety 2 InitConfig / workspaces under data/runs/<id>/society/.
# n_questions: 1 so a careless click cannot fire 12×50.
run_id: phase2-e2012-society-swarm-container
epoch: e2012
models: [swarm-median]
use_swarm: true
swarm_roster: config/swarm.yaml
perspectives: config/perspectives.yaml
question_set: data/questions/e2012.jsonl
max_tool_calls: 4
min_prominence: 0.0
n_questions: 1
category_balance:
  economic: 1
# All retrieval goes through the frozen, egress-blocked Docker sidecar.
sandbox_mode: container
embedding_backend: hashing
allow_mock: false
