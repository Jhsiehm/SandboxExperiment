[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-sandbox"
version = "0.1.0"
description = "Contamination-controlled historical forecasting benchmark."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prediction Sandbox" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "tenacity>=8.3",
  "duckdb>=1.0",
  "rank-bm25>=0.2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "lxml>=5.2",
  "beautifulsoup4>=4.12",
  "warcio>=1.7",
  "orjson>=3.10",
  "packaging>=24.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
society = ["agentsociety2>=2.8"]
dev = ["pytest>=8.2", "ruff>=0.5"]
docker = ["docker>=7.1"]

[project.scripts]
psbx = "psbx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
